# docker-compose para o Google Cloud (Compute Engine / e2-micro)
# Backend + Postgres + Redis + NGINX. O frontend fica no Cloud Run.
#
# Uso (dentro da VM):
#   docker compose -f docker-compose.gcp.yml build --pull backend
#   docker compose -f docker-compose.gcp.yml up -d postgres redis nginx
#   docker compose -f docker-compose.gcp.yml run --rm --no-deps backend npx prisma migrate deploy
#   docker compose -f docker-compose.gcp.yml up -d --no-deps backend
#
# As variáveis ${...} são lidas de um arquivo .env.gcp (ou do ambiente) na VM.
# O arquivo da service account do GCS precisa estar em docker/gcp/credentials.json.

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: agrobuscafacil-backend
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - API_PREFIX=api
      - API_VERSION=v1
      - DATABASE_URL=postgresql://agrobusca:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório}@postgres:5432/agrobuscafacil?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://www.agrobuscafacil.com.br}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET é obrigatório}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET é obrigatório}
      - JWT_REFRESH_EXPIRES_IN=7d
      - BCRYPT_SALT_ROUNDS=12
      - THROTTLE_TTL=60000
      - THROTTLE_LIMIT=500
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      - GCS_BUCKET=${GCS_BUCKET}
      # Bucket PRIVADO para anexos de suporte (nunca público).
      - GCS_PRIVATE_BUCKET=${GCS_PRIVATE_BUCKET:?GCS_PRIVATE_BUCKET é obrigatório}
      - GCS_CREDENTIALS_FILE=${GCS_CREDENTIALS_FILE:-/etc/gcp/credentials.json}
      - GCS_PUBLIC_BASE_URL=${GCS_PUBLIC_BASE_URL}
    volumes:
      - ./docker/gcp:/etc/gcp:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - agrobusca-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: agrobuscafacil-postgres
    environment:
      - POSTGRES_DB=agrobuscafacil
      - POSTGRES_USER=agrobusca
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agrobusca-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrobusca -d agrobuscafacil']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agrobuscafacil-redis
    command: /bin/sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - agrobusca-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: agrobuscafacil-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/sites-gcp:/etc/nginx/sites-enabled:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - agrobusca-network
    restart: unless-stopped

networks:
  agrobusca-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
