<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pôr do sol sobre plantação de trigo">
  <defs>
    <linearGradient id="abs-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="45%" stop-color="#9a3412"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="abs-sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#abs-sky)"/>

  <!-- sun -->
  <circle cx="800" cy="440" r="210" fill="url(#abs-sun-glow)" opacity="0.7"/>
  <circle cx="800" cy="440" r="88" fill="#fef9c3"/>

  <!-- cloud streaks -->
  <g fill="#7c2d12" opacity="0.28">
    <ellipse cx="350" cy="180" rx="180" ry="20"/>
    <ellipse cx="1250" cy="140" rx="200" ry="22"/>
    <ellipse cx="900" cy="240" rx="260" ry="16"/>
  </g>

  <!-- birds -->
  <g stroke="#431407" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M480 200 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M560 235 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M1080 190 q9 -9 18 0 q9 -9 18 0"/>
  </g>

  <!-- field -->
  <path d="M0 480 Q 800 440 1600 480 V700 H0 Z" fill="#292018"/>

  <!-- crop rows converging to the sun -->
  <g stroke="#f59e0b" stroke-width="5" opacity="0.35">
    <line x1="800" y1="480" x2="120" y2="700"/>
    <line x1="800" y1="480" x2="420" y2="700"/>
    <line x1="800" y1="480" x2="650" y2="700"/>
    <line x1="800" y1="480" x2="800" y2="700"/>
    <line x1="800" y1="480" x2="950" y2="700"/>
    <line x1="800" y1="480" x2="1180" y2="700"/>
    <line x1="800" y1="480" x2="1480" y2="700"/>
  </g>

  <!-- wheat stalk silhouettes -->
  <g stroke="#431407" stroke-width="6" stroke-linecap="round">
    <line x1="180" y1="700" x2="180" y2="560"/>
    <line x1="250" y1="700" x2="258" y2="585"/>
    <line x1="1350" y1="700" x2="1342" y2="580"/>
    <line x1="1430" y1="700" x2="1430" y2="565"/>
  </g>
  <g fill="#d97706">
    <ellipse cx="180" cy="545" rx="16" ry="30"/>
    <ellipse cx="258" cy="570" rx="14" ry="26"/>
    <ellipse cx="1342" cy="565" rx="14" ry="26"/>
    <ellipse cx="1430" cy="550" rx="16" ry="30"/>
  </g>
</svg>
