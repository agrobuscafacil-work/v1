# Cloud Build para o frontend (Next.js) no Cloud Run.
# O cloudbuild do gcloud subst que substitui as NEXT_PUBLIC_* em build time.
# Veja scripts/gcp/deploy-frontend.sh.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agrobuscafacil-frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_SOCKET_URL=$_NEXT_PUBLIC_SOCKET_URL'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_NAME=$_NEXT_PUBLIC_APP_NAME'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=$_NEXT_PUBLIC_APP_URL'
      - '.'

images:
  - 'gcr.io/$PROJECT_ID/agrobuscafacil-frontend:latest'
