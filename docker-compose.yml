version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: agrobuscafacil-frontend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - backend
    networks:
      - agrobusca-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: agrobuscafacil-backend
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://agrobusca:agrobusca123@postgres:5432/agrobuscafacil?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - agrobusca-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: agrobuscafacil-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=agrobuscafacil
      - POSTGRES_USER=agrobusca
      - POSTGRES_PASSWORD=agrobusca123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - agrobusca-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrobusca -d agrobuscafacil']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agrobuscafacil-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - agrobusca-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: agrobuscafacil-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites:/etc/nginx/sites-enabled
    depends_on:
      - frontend
      - backend
    networks:
      - agrobusca-network
    restart: unless-stopped

networks:
  agrobusca-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
